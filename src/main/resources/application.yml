spring:
  application:
    name: massage-salon

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/massage_salon}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET}   # обязателен: openssl rand -base64 32
    expiration-ms: 86400000   # 24 часа

  cors:
    # Сайты, которым разрешено обращаться к API, через запятую
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  owner:
    email: ${OWNER_EMAIL:admin@salon.ru}
    # Если пусто и аккаунта ещё нет — пароль генерируется и один раз пишется в лог
    password: ${OWNER_PASSWORD:}

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    owner-chat-id: ${TELEGRAM_OWNER_CHAT_IDS:}   # chat ID руководителей через запятую

logging:
  level:
    com.salon: DEBUG
    org.springframework.security: INFO
